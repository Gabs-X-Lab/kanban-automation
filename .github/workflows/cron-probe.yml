# Sonda temporária: verifica se o agendamento dispara nesta org (Etapa 11, investigação do cron).
name: Cron probe

on:
  schedule:
    - cron: "2-59/5 * * * *"

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "schedule disparou em $(date -u +%H:%M:%S) (cron '${{ github.event.schedule }}')"
