# Opção B: automação do Kanban SEM arquivos nos repositórios do produto.
#
# Este repositório só contém a automação. Em horário agendado, ele lê o estado real
# dos PRs/Issues dos repositórios do produto pela API e corrige as colunas do Project:
#
#   Fase 1: cada PR aberto            → project-status.sh --pr N --auto   (Draft PR / In Review / Approved / In Progress)
#   Fase 2: Issue em coluna de PR sem PR aberto → --issue N --auto       (→ To Do)
#   Fase 3: Issue em Backlog/To Do com branch vinculada → --linked       (→ In Progress)
#
# Merge → Done, Issue nova → Backlog e reaberta → To Do continuam com os workflows nativos.
# Custo da opção: atraso de até um intervalo do cron (mínimo do GitHub: 5 minutos) + fila do GitHub.
#
# Configuração (Settings → Secrets and variables → Actions):
#   Secret   PROJECT_APP_PRIVATE_KEY   chave do GitHub App (o App fica instalado só nos repositórios do produto)
#   Variable PROJECT_APP_CLIENT_ID
#   Variable PROJECT_OWNER / PROJECT_NUMBER / OWNER_TYPE
#   Variable TARGET_REPOSITORIES       nomes dos repositórios do produto, separados por vírgula (mesmo owner)

name: Kanban reconcile

on:
  schedule:
    # A cada 15 min, 8h–18h (Brasil, UTC−3) de segunda a sexta. Cron em UTC.
    - cron: "*/15 11-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanban-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconciliar colunas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (somente scripts/)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Gerar token do GitHub App (só para os repositórios do produto)
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
          owner: ${{ vars.PROJECT_OWNER }}
          repositories: ${{ vars.TARGET_REPOSITORIES }}
          permission-issues: read
          permission-pull-requests: read
          permission-organization-projects: write

      - name: Reconciliar
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          OWNER_TYPE: ${{ vars.OWNER_TYPE }}
          TARGET_REPOSITORIES: ${{ vars.TARGET_REPOSITORIES }}
          LINK_RETRIES: "1"   # vínculos já consolidados; sem espera por PR sem "Closes"
        run: |
          failures=0
          for name in ${TARGET_REPOSITORIES//,/ }; do
            export TARGET_REPOSITORY="$PROJECT_OWNER/$name"
            echo "===== $TARGET_REPOSITORY"

            echo "Fase 1: PRs abertos"
            for pr in $(gh pr list -R "$TARGET_REPOSITORY" --state open --limit 200 --json number --jq '.[].number'); do
              echo "::group::PR #$pr"
              scripts/project-status.sh --pr "$pr" --auto || failures=$((failures + 1))
              echo "::endgroup::"
            done

            echo "Fase 2: Issues abertas em colunas de PR"
            issues=$(gh api graphql --paginate -F owner="$PROJECT_OWNER" -F number="$PROJECT_NUMBER" -f query="
              query(\$owner: String!, \$number: Int!, \$endCursor: String) {
                $OWNER_TYPE(login: \$owner) {
                  projectV2(number: \$number) {
                    items(first: 100, after: \$endCursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        status: fieldValueByName(name: \"Status\") { ... on ProjectV2ItemFieldSingleSelectValue { name } }
                        content { ... on Issue { number state repository { nameWithOwner } } }
                      }
                    }
                  }
                }
              }" --jq ".data.$OWNER_TYPE.projectV2.items.nodes[]
                     | select(.content.state == \"OPEN\" and .content.repository.nameWithOwner == \"$TARGET_REPOSITORY\")
                     | select(.status.name == \"Draft PR\" or .status.name == \"In Review\" or .status.name == \"Approved\")
                     | .content.number")
            for issue in $issues; do
              echo "::group::Issue #$issue"
              scripts/project-status.sh --issue "$issue" --auto || failures=$((failures + 1))
              echo "::endgroup::"
            done

            echo "Fase 3: Issues com branch vinculada"
            scripts/project-status.sh --linked || failures=$((failures + 1))
          done

          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures item(ns) falharam na reconciliação"
            exit 1
          fi
